  tech_aid_corps_1: "Полевой госпиталь I"
  tech_aid_corps_1_desc: "Оказание немедленной медицинской помощи нашим солдатам и раненым в полевых условиях снизит наши потери. Любая жизнь, которую можно спасти, — это шанс, которым нужно воспользоваться."
  tech_aid_corps_2: "Полевой госпиталь II"
  tech_aid_corps_2_desc: "Если снабдить наших фельдшеров марлевыми повязками и бинтами, это поможет остановить кровотечение и выиграть время, чтобы эвакуировать раненых с передовой."
  tech_aid_corps_3: "Полевой госпиталь III"
  tech_aid_corps_3_desc: "Также можно обеспечить их жгутами, медицинским пластырем и бандажами, чтобы ещё больше снизить смертность среди раненых в полевых условиях."
  tech_aid_corps_4: "Полевой госпиталь IV"
  tech_aid_corps_4_desc: "До недавнего времени было практически невозможно обеспечить наших хирургов-травматологов стерильными инструментами и медицинским оборудованием. Но теперь, когда мы можем это сделать, вероятность заражения значительно снижается."
  tech_aid_corps_5: "Полевой госпиталь V"
  tech_aid_corps_5_desc: "Внесены дальнейшие усовершенствования для оказания неотложной медицинской помощи нашим войскам в полевых условиях. С появлением гемостаза и герметичных повязок теперь даже самые тяжелые ранения можно вылечить."
