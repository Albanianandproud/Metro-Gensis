  tech_aid_corps_1: "Field Hospital I"
  tech_aid_corps_1_desc: "Providing immediate medical attention to our soldiers and wounded out in the field will improve our casualty rate. Any life which could be saved is a chance which should be willingly taken."
  tech_aid_corps_2: "Field Hospital II"
  tech_aid_corps_2_desc: "Supplying our Paramedics with gauzes and bandages will help stem wounds and buy time to bring injured soldiers off from the front."
  tech_aid_corps_3: "Field Hospital III"
  tech_aid_corps_3_desc: "Torniquets, medical tape and braces also can be supplied to further decrease the mortality rate of our wounded forces in the field."
  tech_aid_corps_4: "Field Hospital IV"
  tech_aid_corps_4_desc: "Sterilized tools and medical equipment provided to our emergency surgeons has been near impossible up until this point. But now that we can make such an endeavour, the likelyhood chance of infection can be dramatically reduced."
  tech_aid_corps_5: "Field Hospital V"
  tech_aid_corps_5_desc: "Further improvements have been made to provide immediate medical attention to our forces in the field. With the introduction of Hemostatic agents and pressurized dressings. Now even the most fatal of injuries now have the possibility to be treated."