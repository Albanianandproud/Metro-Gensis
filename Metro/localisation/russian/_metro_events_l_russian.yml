l_russian:
  nf_metro.1.t: "БЕТА БЕТА БЕТА БЕТА!!!!!!!!!!!!"
  nf_metro.1.d: "Добро пожаловать в Metro HOI4 Mod! Если вы видите это сообщение, то вы играете в BETA-версию Metro Mod. Это не окончательный вариант. Не все готово для релиза в main.\nКак и ожидалось, вы, скорее всего, столкнетесь со множеством ошибок и багов. Рекомендуется проявлять осмотрительность. Пожалуйста, сообщайте о любых ошибках или сбоях, с которыми вы столкнетесь, в Discord. Или HEAVY через Steam. Спасибо.\n- Metro Genesis Dev Team"
  nf_metro.1.a: "Спасибо."

  nf_metro.4.t: "Фашисты в глубинах"
  nf_metro.4.d: "Мы получили сообщения о передвижении в туннелях метро. Это не беспорядочное движение, не неуклюжее ковыляние и не крадущаяся поступь. Нет, оно равномерное... слишком равномерное. Явно человеческое. Хотя таких сообщений немного и поступают они редко."
  nf_metro.4.a: "Нам нужно беспокоиться не только о крысах."

  nf_metro.5.t: "Отколовшаяся секта"
  nf_metro.5.d: "После того как фюрер отказал Штортебекеру в снисхождении и не позволил ему вернуться в Рейх, тот решил бежать. Проклятый негодяй! Забрал с собой столько своих «преданных» приспешников, сколько смог... Хотя, возможно, это и к лучшему. Такие, как Штортебекер, далеки от идеала Рейха. Наши разведчики сообщают, что он и его банда неудачников обосновались где-то в южной части Метро."
  nf_metro.5.a: "Проклятый негодяй!"

  nf_metro.6.t: "Рост промышленности"
  nf_metro.6.d: "По мере роста нашей промышленной базы растёт и потребление энергии. Нашим специалистам и рабочим требуется всё больше электричества, чтобы удовлетворять растущие потребности. Мы должны обеспечить бесперебойную подачу энергии и устранить любые перебои. Будь то строительство новых нефтеперерабатывающих заводов, торговля энергией с соседними станциями или альтернативные способы."
  nf_metro.6.a: "Мы будем иметь это в виду."