l_english:
  VDN_branching_out: "Beyond [VDN.capital.GetName]"
  VDN_branching_out_desc: "[VDN.capital.GetName]s' hermetic was dismantled by engineers more than a decade ago. As of recent, we haven't seen a single mutant straying in from the north. Has the mutant threat subsided? Some within the commonwealth believe so, and are convinced now is none other than a good time to attempt to expand outwards, and to resettle neighboring [307.GetName] Station."

  VDN_establish_defensive_watch: "Defensive Watch"
  VDN_establish_defensive_watch_desc: "The tunnel beyond [VDN.capital.GetName] station has been cleansed of rubble. The half-dozen swollen rats were no match for our soldiers! A garrison force should be entrusted in securing the stretch of tunnel, allowing for the safe passage of supply and eventually settlers further north."

  VDN_repair_routelines: "Barricade Side-Tunnels"
  VDN_repair_routelines_desc: "We can't secure every crack, or shrouded maintenance tunnels. Our only choice is to attempt to barricade them off, and hope whatever lingers beyond doesn't stray into the light."

  VDN_drawing_from_populace: "Draft from [VDN.capital.GetName] Station"
  VDN_drawing_from_populace_desc: "More able-bodied people are needed to man the station watch. Undoubtedly our plans to draft up the populace will be met with more than simple grumbling."

  VDN_funding_expansion: "Funding Further Expansions"
  VDN_funding_expansion_desc: "More arms are needed for our sentries. Weapon caravans are rare sight in this part of the Metro, but undoubtedly once word spreads of our expansion many merchants will be clambering to strike promising deals with our station. Perhaps especially those from the Hanza..."

  VDN_establish_defensive_watch_3: "Our Ascent to [307.GetName]"
  VDN_establish_defensive_watch_3_desc: "With the preliminary tunnel now secured, further expansion is warranted. Just a little further now..."

  VDN_fortifications: "Hasty Fortifications"
  VDN_fortifications_desc: "These hastily erected barricades are far better, than standing directly out in the open."

  VDN_funding_outwards: "Emergency Defensive Budget"
  VDN_funding_outwards_desc: "More troops. More guns, more hours manning the emplacements invariably leads to more bullets being spent funding our military efforts. Supplies already stretching thin, another round of funding must be ensured."

  VDN_communication_lines: "Communication Lines"
  VDN_communication_lines_desc: "Lightning-fast communication is necessary between our station, and to our sorties further north. Even if they are bound via flimsy wires, its far far better than screaming desperately into the void hoping someone will answer."

  VDN_explore_botanical_gardens: "Into [307.GetName] Station"
  VDN_explore_botanical_gardens_desc: "With the coast clear and safe means to traverse through the tunnels, now's the time to begin expanding outwards. Another station will be soon added to our burgeoning state."
  VDNK_botanical: "Our forces will begin the into §Y[307.GetName]§!, clearing the way for settlers to follow and eventually begin reclaiming the station."

  VDN_the_VDNKH: "Picking up the Pieces"
  VDN_the_VDNKH_desc: "Following our thwarted plans to colonize [307.GetName], support for the current administration is at an all-time low. We lost valuable resources, manpower and more importantly support in our failed attempt. Prioritizing replenishing the support of our population is more crucial than ever."
  
  VDN_commercialized_fungiculture: "Commercialized Fungiculture"
  VDN_commercialized_fungiculture_desc: "Resources and man-hours were diverted from our agriculture to support our initial colonizing attempts. Our first step should be reinvesting time and energy into properly establishing our mushroom production into an exportable produce."

  VDN_establish_libraries: "Establish a Library"
  VDN_establish_libraries_desc: "We are not destitute, unlike other stations. There is still value to be found in books, even when many others would absentmindedly use the pagers as fuel. With any spare bullets, we may establish an assortment of books for the public to make use of."

  VDN_fund_bookreading: "Mandated Literacy"
  VDN_fund_bookreading_desc: "Our children will oneday inherit the world - or whats left of it. We must give them every bit of advantage we can. No child should be left behind."
  VDN_trade_for_research: ""

  VDN_social_support: "Social Support"
  VDN_social_support_desc: "A cohesive network must be established in order to protect our population from falling into hard times. A shortfall of support will undoubtedly improve the quality of life for our citizens."

  VDN_health_hygiene: "'Universal' Healthcare"
  VDN_health_hygiene_desc: "Public initiatives driven by state funds will seek to wholeheartedly remove the risk of disease and infection amongst our population. Preventative care, and medical monitoring will allow for us to keep our populace healthy and productive."

  VDN_research_6: "Knowledge is Wealth"
  VDN_research_6_desc: "Material wealth may only get us so far, but skills and knowledge holds far greater, long-lasting power."

  VDN_research_6a: "Knowledge Export Aid"
  VDN_research_6a_desc: "Why stop at mushrooms? Our knowledge in of itself is also a valuable commodity. We may export aid all throughout the Metro to those who seek it."

  VDN_mushroom_tea_industry: "Mushroom-Tea Industry"
  VDN_mushroom_tea_industry_desc: "Exports of Tea shupped to the Ring destined for further afield will bring us valuable wealth which we may use to improve our station."

  VDN_piggies: "Establish Pigsties"
  VDN_piggies_desc: "We may also establish several pigsties, as long as we find suitable sows to breed. Exporting their meat and hides would be an overall net-benefit too."

  VDN_exports: "Export Economy"
  VDN_exports_desc: "Vdnkh station relies heavily upon the exports of produce to survive. Trade is the arterial life-vessel of the station, and perhaps the entire north-eastern section of the line. Without it, VDNKh would have undoubtedly fallen years ago, subsequently flooding the rest of the Metro with mutants from Botanical Garden."
  VDN_export_idea_tt: "As long as we have either §YFree Trade§! or §YExport Focus§! Trade Law, we recieve:"

  VDN_exports_2: "Titan of Interstational Trade"
  VDN_exports_2_desc: "Far from the prosperity seen from the Hanza, or even the Arbat or Polis, Vdnk station is able to live comfortably as long as merchant caravans flow freely undeterred from trouble. Some may even say that with time and effort, Vdnkh has all the right to become a major player in the Metro."

  VDN_medical_wards: "Triage Wards"
  VDN_medical_wards_desc: "Improving the lives of our citizens is a moral imperative! We must make great strides in ensuring every person has the best possible quality of life we can afford."

  VDN_economy_2: "Mushroom Economy"
  VDN_economy_2_desc: "Far from the breadbaskets of the likes of the Zamoskvoretskaya trading alliance, VDNKh primarily relies upon the export of foodstuffs to the Hanza in order to turn a profit, and maintain a living. "

  VDN_economy_2a: "From the Bones of Civilization"
  VDN_economy_2a_desc: "The bones of the Earth are ours to plunder. Directly organizing our scavenger teams and prioritizing the resources we fundamentally lack shall assure that we do not run out of the most necessary resources in a pinch."

  VDN_economy_3: "Necessesities of Scavenging"
  VDN_economy_3_desc: "Recovering materials from any scrap heaps or forgotten tunnels should be prioritized. We can't afford to stick our noses up to every rusted beam, or pile of rubble."

  VDN_economy_3a: "Refurbished Dynamos"
  VDN_economy_3a_desc: "Energy is a luxury that most, of not all, can barely afford. Where entire factories could churn enough power to feed millions, improvised dynamos and wheezing generators is the only thing that can afford our station not falling into complete darkness"

  VDN_economy_4: "Modest Prosperity"
  VDN_economy_4_desc: "We may not be as rich as the Hanza, or decadent as the politburo of the Redline or even as shielded from the horrors of this dying world to the likes of Polis, but for our citizens who live ordinary lives, Ordinary is far above what many other stations could dream of."

  VDN_economy_5: "Commerce of Necessity"
  VDN_economy_5_desc: "Survival is a currency in all of its own. Bought and to be sold. Every crate of mushrooms, bag of tools or cartridge exchanged from one hands to another. To safeguard the future of [ROOT.Capital.GetName], this must never cease."

  VDN_economy_6: "Network of Commerce"
  VDN_economy_6_desc: "Commerce can be measured not by riches, but by its resolve. Every caravan protected, trade honored only strengthens our position as a beating arterial vessal in the Metro."

  VDN_economy_7: "Dedicated Technicians"
  VDN_economy_7_desc: "To afford our own engineers not only to repair and refabricate tools, but to devise and construct entirely new gear must be obstained."

  VDN_economy_commonwealth: "Our Determined Destiny"
  VDN_economy_commonwealth_desc: "In the decades since complete collapse, society has gone backwards in some respect, but also has gone forwards. Culture still thrives in the Metro, and whilst more forget how the old world worked and functioned, a new world has begun to form in its sted."

  VDN_economy_8: "Promote Mentorships"
  VDN_economy_8_desc: "Every tool which breaks is another slither of the old world permanently lost. Yet the greatest treasures of the world before is not equipment, but knowledge required to keep them operational. Formalizing these practices, and ensuring the knowledge is passed down will keep it preserved,"

  VDN_economy_9: "Expand Economic Zones"
  VDN_economy_9_desc: "Maintaining a network of scavengers and prospecting sorties will help us coordinate efforts across the line, bringing us more resources with every success."

  VDN_burgeoning_station2: "Prosperity in Abundance"
  VDN_burgeoning_station2_desc: "Not only should Vdnkh station live in modest prosperity, but the rest of the Commonwealth should also share the same living standards."

  VDN_burgeoning_station0: "Fortified against the Night"
  VDN_burgeoning_station0_desc: "Similarly, all stations should follow the benchmark set about by Vdnkh, each station should be a fortress in its own right."

  VDN_burgeoning_station1: "Localized Scavenger Depots"
  VDN_burgeoning_station1_desc: "Scavenger depots will give our local scavengers a place to properly store, and reclaim the remnants of the old world before they disappear forever."

  VDN_the_VDNKH: "Picking up the Pieces"
  VDN_the_VDNKH_desc: "With our failure, the outlook has become overly pessimistic. The sudden increased mutant activity from Botanical has only kicked up a storn of complaints and naysayers in our station. We must walk a tightrope between serving the needs of our community, and keeping them safe from the horrors of the darkness."

  VDN_political_1: "Political Manoeuvers"
  VDN_political_1_desc: "Preservation of Vdnkh station is imperative, not only for our citizens who live here, but for the whole Metro as a whole. Our fate remains in our own hands, we must unite as one, or risp being blown away."

  VDN_exhibition_station: "Housing Construction"
  VDN_exhibition_station_desc: "The first steps which should be taken in properly meeting the needs of our citizens is the place in which they sleep. Ensuring every citizen has a roof over their heads, and a warm fire to return to after a days worth of work should be our top priority."

  VDN_planning_zones: "Planning Zones"
  VDN_planning_zones_desc: "Space is finite, and must be fiercely spend and considered carefully. Properly designating zones and areas for future construction work is a good choice."

  VDN_citizens_to_work: "Put the Citizens to Work"
  VDN_citizens_to_work_desc: "Idleness is a luxury that we cannot afford. Every citizen; young, old, male or female, must earn their keep."

  VDN_salvage: "Salvage Efforts"
  VDN_salvage_desc: "Rusted beams, shattered cinderblocks and rebar still pose some use, even if it doesn't immediately seem so. We should store these resources for future use, whatever purpose they may eventually possess."

  VDN_procure_tools: "Tooling Efforts"
  VDN_procure_tools_desc: "One blunt-saw between several dozen carpenters is a recipe for bottlenecks. At the very least if we cannot procure fresh new tools, we should have multiple of the same make or sorts."

  VDN_wooden_shacks: "Wooden Shacks"
  VDN_wooden_shacks_desc: "More permanent structures was something that we couldn't afford - until now. Able to withstand more than a simple tent."

  VDN_shared_tooling: "Shared Workstations"
  VDN_shared_tooling_desc: "Communal Workbenches will allow our citizens a place to work, without having to afford such an extreme cost. With a centralized place to work, store tools and resources, this will drive the overall productivity and efficiency of our workers."

  VDN_burgeoning_station: "Burgeoning Station"
  VDN_burgeoning_station_desc: "What was little more than half a dozen rag tents years ago, has now grown into a flourishing settlement, rife with the noise and sight of civilization in all of its decrepit but modest glory."

  VDN_shared_tooling_2: "Industrial Extentions"
  VDN_shared_tooling_2_desc: "Specialized workbenches, machinery stations and other improved areas will undoubtedly allow our technicians and crafters to improve and hone their craft."

  VDN_soviet_ideals_path: "Lean into Soviet Nostalgia"
  VDN_soviet_ideals_path_desc: "Collectivist solidarity, equality and a strong state should be our top priority. Rose-tinted perspective of the past or not, communal spirit and guaranteeing the basic needs of our citizenry are met should be met."

  VDN_collective_path: "Collective Unity"
  VDN_collective_path_desc: "Security of the Collective, and a federal, centralized system emphasising survival and self-defense is imperative. We can only rely upon ourselves, and upon our neighbors for support."

  VDN_centralize_station_authority: "Empower the Station Council"
  VDN_centralize_station_authority_desc: "Chiefly amongst our populace, the Station Council oversee the daily workshifts amongst our stations populace, deciding on how best fit to steer the station towards meaningful goals. We can further give them political and social authority, especially necessary during times of strife."

  VDN_political_7: "Forging a Unified Line"
  VDN_political_7_desc: "From one end of the line to the other, we must become a unified entity, or risk being snuffed out. All for one. One for All."

  VDN_political_6: "A Common Cause"
  VDN_political_6_desc: "Based upon the principles of survival, security and economic-sufficiency, most if not all stations across the Metro seek to obtain these or some at the very least. We all share similar goals and aims - something which we can use to develop a natural bond with our neighbors."

  VDN_political_9: "Strengthen Interstation Relations"
  VDN_political_9_desc: "Exhibition station is not some isolated station, as some might believe. Over the years through economic ties we've become a prominent export station. As much as stations afar may rely upon our exports of Tea, the fact cannot be overstated that we in turn rely upon imports of weapons to fortify ourselves."

  VDN_political_8: "Cultivate Goodwill"
  VDN_political_8_desc: "The Metro is a vast space, with markets and stalls which have yet to see our goods. Though selling it at vastly reduced price might cheapen the perspective our value holds, instead selling it at a mark-downed price to close traders would undoubtedly be seen as a gesture of goodwill."

  VDN_political_9A: "Foster Interstation Trade Relations"
  VDN_political_9A_desc: "Beyond our export of Tea and Mushrooms, our reputation is an priceless. Through regular, steady trade negotiations. Stimulating economic growth is a net-positive, not to mention giving a further incentive to maintain stable relationships."

  VDN_political_10: "Arming the Caravans"
  VDN_political_10_desc: "To protect our own interests and our trade, our caravans must be armed with appropriate equipment to stave off would-be attackers. Mutants or otherwise."

  VDN_political_11: "Anchor of Cooperation"
  VDN_political_11_desc: "Trade with neighboring stations gives us a metaphorical foot in the door. No self-serving station would dare to dismiss our Tea imports, just as much as we would stick up our nose to their offers. Trade is a win-win for all parties."

  VDN_capitalism_path: "State Capitalism"
  VDN_capitalism_path_desc: "Direct ownership and heavily influencing, and supporting our local export economy will allow us accumulate wealth and also to compete as a major player in the Metro economy. With a hands-on approach, we can use the wealth generated to improve the lives of our citizenry. Not only just monetarily, but also through innovation and talent."

  VDN_political_12: "Champion Civic Freedoms"
  VDN_political_12_desc: "To stand firm and strong against the horrors of the night, we must be the lit torch in the darkness. We must ensure our citizens needs are represented and adequately met. The ideals of life must be highly valued."

  VDN_political_13: "Encourage Private Enterprise"
  VDN_political_13_desc: "Our isolation shouldn't be a limiting factor in our economic power. We should aim to channel our people into taking up crafts in their freetime; from knitting to repairing tools or equipment. Creating a new avenue to expand our export industry."

  VDN_export_economy: "Secure Trade Agreements"
  VDN_export_economy_desc: "Though Hanza remains ambivalent to us, we have previously enjoyed a modicum of economic opportunities straddling their border. Our goods and services, though at heavy tarrifs, have far further travelling power. We can negotiate further economic leverages, with the eventuality of securing our own trade links."

  VDN_political_15: "Monopolize the Mushroom Trade"
  VDN_political_15_desc: "Other stations can only dream of competing with our burgeoning export economy. With trade comes affluence and with affluence we can exchange it for power."
  VDN_political_15_tt: "Trade Decisions now provide doubled bullets."
  VDN_political_15_a_tt: "Unlocks Decisions to bring §Y[PRO.GetFlag][PRO.GetName]§! into our sphere of influence, potentially puppeting them if we have yet to form the VDNKh Commonwealth!"

  VDN_political_16: "Communal Property"
  VDN_political_16_desc: "Strides must be made in restoring the rights of access to facilities to our population. Workbenches, tools, our citizens will own the means to their labor."

  VDN_political_17: "Prosperity for All"
  VDN_political_17_desc: "We represent our people. Their needs, concerns and woes in part combine to form and represent our own. One voice unheard is a stain upon our ability to govern. All our populaces' needs must be met."

  VDN_political_18: "Raise Living Standards"
  VDN_political_18_desc: "Easy, simple steps can be implemented in dramatically raising the living standards of our poulation. The fundamentals of housing, food and clean drinking water have already adequately been met. But improving access to proper healthcare, education and leisure are necessary."
  
  VDN_political_19: "Return of Stolovayas"
  VDN_political_19_desc: "Bread lines demarked Russias soviet history. Instead of demarking economic burdens and food shortages, instead this time will demonstrate food abundance for our citizens. A meal a day at the very least."

  VDN_self_sufficiency: "Self Sufficiency"
  VDN_self_sufficiency_desc: "In a world long-since passed, and a climate which betrays any sense of nomalcy, the best thing we may proffer to our people is ensuring all their basic needs can be indefinitely met. Food, shelter and stability without having to rely upon neighbouring stations or strangers for support."

  VDN_soviet_ideals_path1: "A Place Among Stations"
  VDN_soviet_ideals_path1_desc: "Our reputation may not meet the economic prosperity of Kievskaya, or the military might of Tverskaya nor the scientific prowess of Biblioketa, but for the mundane, everday person struggling to meek out a pitiful living, VDNKh station is an ideal which can.. could, be obtained."

  VDN_burgeoning_power: "The Metro Looks to Us"
  VDN_burgeoning_power_desc: ""

  VDN_commonwealth: "Diplomatic Outreach"
  VDN_commonwealth_desc: "Making contact with other powers is a net positive. Our isolation is not as a positive as we wish to think. Broadening ties with the other polities of the Metro will allow us to become an integrated part of the fabric of civilization, or what's left of it."
  VDNK_commonwealth_forming: "Pursuing this focus branch will allow us to form the §YVDNKh Commonwealth§! Quicker!\n\nCertain focuses in our tree may also complete certain focuses of this branch."

  VDN_commonwealth_fight: "Bring Order to the Line"
  VDN_commonwealth_fight_desc: ""

  VDN_commonwealth_telecommunications: "Establish Telecommunication Lines"
  VDN_commonwealth_telecommunications_desc: "Still, many tunnels seen and unseen running into Exhibition remain cluttered with debris and old trash. By mobilizing our population towards the restoration of the station, we can make traversal far easier."

  VDN_commonwealth_humanitarian_aid: "Launch Humanitarian Aid Caravans"
  VDN_commonwealth_humanitarian_aid_desc: ""

  VDN_commonwealth_mutual_defense: "Mutual Defense Pact"
  VDN_commonwealth_mutual_defense_desc: ""

  VDN_commonwealth_friendship_pact: "Pact of Friendship"
  VDN_commonwealth_friendship_pact_desc: ""

  VDN_commonwealth_telecommunications_5: "Establish Co-Economic Prosperity Sphere"
  VDN_commonwealth_telecommunications_5_desc: ""

  VDN_commonwealth_formed_focus_1: "Freedom, Equality, and Fraternity!"
  VDN_commonwealth_formed_focus_1_desc: ""

  VDN_commonwealth_formed_focus_4_economic_1: "Ties in Which Bind"
  VDN_commonwealth_formed_focus_4_economic_1_desc: "Not only do we share the kinship bestowed as neighbours, but our aims are mutual; self-defence, self-determination and self-sufficiency. Now is such a better time than ever to finally bind our aims together."

  VDN_commonwealth_formed_focus_4_economic_2: "Fixing Time Blindness"
  VDN_commonwealth_formed_focus_4_economic_2_desc: "Would you believe it? The Citizens of [317.GetName] can't even tell the time! Their station clock was stolen years ago, and ever since the station has been living without any sense of time. First thing should be installing clocks around the station at the very least."

  VDN_commonwealth_formed_focus_4_economic_3: "Support [424.GetName] Local Economy"
  VDN_commonwealth_formed_focus_4_economic_3_desc: "Many citizens of [424.GetName] operate as merchants, and proffer in lucrative trade with the neighboring Prospekt Mira. Though some other trades do persist, namely the pig manure and knitting trade. Both are key arterial vessels the stations economy."

  VDN_commonwealth_formed_focus_4_economic_4: "Assist [424.GetName] Garrison"
  VDN_commonwealth_formed_focus_4_economic_4_desc: "Though initially appearing to be more impressive than the likes of their nighbors, [424.GetName] maintains its own detachments serving as tunnel guards. Although their armed forces are mainly centralized upon the southern direction, given the multiple tunnels to Prospekt Mira, this greatly depletes the resources the station has."
  VDN_commonwealth_formed_focus_4_economic_4_tooltip: "Cost to Annex §Y[RIZ.GetFlag][RIZ.GetName]§! via decision £pol_power_icon §G-100§!"

  VDN_commonwealth_formed_focus_4_economic_5: "Gateway to the Ring"
  VDN_commonwealth_formed_focus_4_economic_5_desc: "Although dislodging the gloomy mood of the station may be impossible, their situation has been drastically upheaved because of our assistance. Tunnels manned, economy secured. Though the grumbling complaints may never erode anytime soon, many can't doubt that things are turning up for the best."

  VDN_commonwealth_formed_focus_4_economic_6: "Bring Discipline to [317.GetName]s Garrison"
  VDN_commonwealth_formed_focus_4_economic_6_desc: "The Armed forces of [317.GetName] is not very proficient, to put it nicely. Morale and discipline is extremely low across the rank and file. With how poor the station is, their armed forces can only afford quilted jackets and the most basic essentials for their sorties."
  VDN_commonwealth_formed_focus_4_economic_6_tooltip: "Cost to Annex §Y[RIZ.GetFlag][RIZ.GetName]§! via decision £pol_power_icon §G-100§!"

  VDN_commonwealth_formed_focus_4_economic_7: "Support [317.GetName] Mushroom Industry"
  VDN_commonwealth_formed_focus_4_economic_7_desc: "Following our economic model, [317.GetName] quickly tried to adapt and imitate us. This however failed catastrophically, with their crops and pigs all failing under mysterious circumstances. With the station barely able to afford to feed itself, their trade dwindled."

  VDN_commonwealth_formed_focus_4_economic_8: "Bringing Prosperity to [317.GetName]"
  VDN_commonwealth_formed_focus_4_economic_8_desc: "Some may have claimed that [317.GetName] was only a poor imitation of Exhibition Station, but no longer. With our assistance, they have begun to flourish and prosper into blossoming station. Our expert farmers assisting their own, and propping up their mushroom and farming economy."

  VDN_commonwealth_formed_focus_4_economic_9: "Relieve Tension in [424.GetName]"
  VDN_commonwealth_formed_focus_4_economic_9_desc: "The Atmosphere of [424.GetName] has always remained tense. Its people living in a constant state of tension. Whether it be pressure exerted from stations to the south, or unseen threats. A gloomy mood has always reigned at the station. No longer now with our full protection, however."

  VDN_commonwealth_formed_focus_4_economic_10: "Rising Star Above the Metro"
  VDN_commonwealth_formed_focus_4_economic_10_desc: "From a small wayward station on the edge of civilization, Vdnkh station has grown into a prosperous society. One could say, a beacon of light against the raging storm."
  VDN_commonwealth_formed_focus_4_economic_10_tooltip: "Unlock the availability to annex §Y[ALK.GetFlag][ALK.GetName]§! and §Y[RIZ.GetFlag][RIZ.GetName]§! via decisions"
  
