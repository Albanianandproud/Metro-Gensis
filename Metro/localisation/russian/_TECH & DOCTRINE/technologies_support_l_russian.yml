  tech_sentinels_1: "Часовые I"
  tech_sentinels_1_desc: "Мы должны адекватно реагировать не только на действия мутантов, но и на саботаж и проявления инакомыслия со стороны наших врагов. Необходимы специальные силы для борьбы с ними и осуществления надзора."
  tech_sentinels_2: "Часовые II"
  tech_sentinels_2_desc: "Полицейская деятельность и патрулирование с целью поддержания общественного порядка и предотвращения вылазок мутантов могут свести к минимуму количество партизан и диверсантов, если таковые появятся."
  tech_sentinels_3: "Часовые III"
  tech_sentinels_3_desc: "Сотрудничество с местными сторонниками и борьба с преступными элементами на оккупированных территориях повысят общую лояльность наших подданных."
  tech_sentinels_4: "Часовые IV"
  tech_sentinels_4_desc: "Предоставление нашим Часовым большей автономии при управлении целыми станциями позволит им действовать более гибко. Будь то ужесточение комендантского часа, ограничение доступа в некоторые части станции или просто допросы и борьба с вредителями."
  tech_sentinels_5: "Часовые V"
  tech_sentinels_5_desc: "Безжалостное подавление оппозиции должно осуществляться с определенной долей стратегической продуманности, с главной целью — интегрировать станции в нашу политическую систему. Хотят того гражданские или нет."

  tech_scavengers_1: "Сборщики I"
  tech_scavengers_1_desc: ""
  tech_scavengers_2: "Сборщики II"
  tech_scavengers_2_desc: ""
  tech_scavengers_3: "Сборщики III"
