  D6_SECTOR_1_START_tt:0 "§YВестибюль у входа§! §H(Уровень 1)§!\nВнешние взрывозащитные ворота Д-6. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_2_START_tt:0 "§YКазарменный блок§! §H(Уровень 2)§!\nСпальные помещения для так и не прибывшего гарнизона. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_3_START_tt:0 "§YЦентральный командный пункт§! §H(Уровень 2)§!\nНервный центр комплекса. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_4_START_tt:0 "§YЦентр связи§! §H(Уровень 2)§!\nАнтенные решетки и распределительные щиты. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_5_START_tt:0 "§YСклады снабжения§! §H(Уровень 2)§!\nСклады, забитые до потолка. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_6_START_tt:0 "§YАнгары для техники§! §H(Уровень 2)§!\nАнгары для техники старого мира. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_7_START_tt:0 "§YАрсенал§! §H(Уровень 3)§!\nОружейные склады старого режима. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_8_START_tt:0 "§YРеакторный комплекс§! §H(Уровень 3)§!\nРеактор, который когда-то обеспечивал энергией всё это. Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_9_START_tt:0 "§YБиолаборатории§! §H(Уровень 3)§!\nГерметичные лаборатории. Над чем они работали?" Нажмите, чтобы начать зачистку этого сектора."
  D6_SECTOR_10_START_tt:0 "§YГлубокое хранилище§! §H(Уровень 4)§!\nСамая глубокая камера Д-6. Нажмите, чтобы начать зачистку этого сектора."
