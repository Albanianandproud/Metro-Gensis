  metro_d6_sector.1.t:0 "Врата Д-6"
  metro_d6_sector.1.d:0 "Огромные герметичные двери наконец поддались. За вестибюлем наши фонари освещают мраморные полы, уложенные для генералов, которые так и не пришли. Воздух затхлый, но дышать можно, а туннели уходят все глубже во тьму. Д-6 открыт для нас."
  metro_d6_sector.1.a:0 "Путь открыт."
  metro_d6_sector.2.t:0 "Пустые нары"
  metro_d6_sector.2.d:0 "Ряд за рядом нары, шкафчики, в которых до сих пор лежит выглаженная форма, столовая с накрытыми столами на тысячу человек. Гарнизон, для которого было построено это место, так и не занял свой пост. С горсткой отставших, которые забредали сюда на протяжении многих лет, было... покончено. Теперь казармы наши."
  metro_d6_sector.2.a:0 "Место для своих."
  metro_d6_sector.3.t:0 "Командный пункт"
  metro_d6_sector.3.d:0 "Ряды консолей под картой страны, которой больше не существует. Из этой комнаты старый режим собирался вести войну и победить в ней после войны. Генераторы один за другим оживают, и экраны, спавшие целое поколение, оживают под нашими руками."
  metro_d6_sector.3.a:0 "Теперь мы отдаем приказы."
  metro_d6_sector.4.t:0 "Голоса в проводах"
  metro_d6_sector.4.d:0 "Центр связи цел — коммутаторы, зашифрованные линии, антенны, уходящие сквозь скальную породу в мёртвый город наверху. Наши радисты клянутся, что уловили обрывок сигнала на старых частотах. Наверное, помехи. Наверное."
  metro_d6_sector.4.a:0 "Продолжайте слушать."
  metro_d6_sector.5.t:0 "Запасы на столетие"
  metro_d6_sector.5.d:0 "Ящики до самого потолка: консервированные пайки, медикаменты, фильтры, ботинки, боеприпасы в промасленной бумаге. Кое-что испортилось, но далеко не всё. То, за что метростроевцы сражались и умирали десятилетиями, лежит здесь в таких количествах, каких не видела ни одна станция."
  metro_d6_sector.5.a:0 "Раздайте припасы."
  metro_d6_sector.6.t:0 "Железные кони"
  metro_d6_sector.6.d:0 "Двери ангара распахнулись, и мы увидели их: грузовики, транспортеры, инженерные машины — даже пара броневиков, покрытых пылью, но целых, выстроившихся в идеальном порядке. С топливом сложнее, но наши механики уже ползают по машинам, как муравьи по сахару." metro_d6_sector.6.a:0 "Заставьте их работать."
  metro_d6_sector.7.t:0 "Арсенал"
  metro_d6_sector.7.d:0 "Стойки с винтовками, покрытыми консервирующей смазкой, ящики с гранатами, тяжелое вооружение — всё это наши солдаты видели только в довоенных книжках с картинками. Арсенал Д-6 — это не выдумка, а реальность, а не сказки, которые торговцы рассказывают у костра. Тот, в чьих руках он находится, держит в своих руках баланс сил в Метро."
  metro_d6_sector.7.a:0 "Вооружите людей."
  metro_d6_sector.8.t:0 "Сердце все еще бьется."
  metro_d6_sector.8.d:0 "Реакторный комплекс откликнулся на команды наших инженеров, как старый солдат на звук горна. Контуры охлаждения выдерживают давление, регулирующие стержни работают исправно. С такой мощностью мы сможем осветить залы, которые оставались темными с тех пор, как упали бомбы, и запустить машины, о которых в Метро могли только мечтать."
  metro_d6_sector.8.a:0 "Выведите его на полную мощность."
  metro_d6_sector.9.t:0 "За запечатанными дверями"
  metro_d6_sector.9.d:0 "Лаборатории были заперты снаружи — все двери, все переборки. Внутри — банки с образцами, инкубаторы и документация, которую наши учёные отказываются обсуждать вслух. Мы взяли то, что может пригодиться, и заварили то, что не пригодится. Некоторые знания — это оружие, а некоторые — болезнь."
  metro_d6_sector.9.a:0 "Возьми то, что нам пригодится. Остальное запри."
  metro_d6_sector.10.t:0 "Глубокое хранилище"
  metro_d6_sector.10.d:0 "На самом дне Д-6, за последней взрывозащитной дверью, находится помещение, для защиты которого и был построен весь комплекс. Ключи запуска. Целевые регистры. Холодная арифметика последнего аргумента Старого мира, сохраненная в идеальном порядке. Мы спустились сюда в поисках спасения. Теперь мы должны решить, что же мы на самом деле нашли."
  metro_d6_sector.10.a:0 "Метро не должно узнать."

