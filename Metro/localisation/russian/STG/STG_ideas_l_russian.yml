 STG_strogino:0 "Строгино"
 STG_strogino_desc:0 "Удивительно, что, отрезанная от соседних станций, Строгино по сравнению с другими станциями метро остаётся относительно приличным местом. Учитывая, что сама станция довольно большая по сравнению с другими станциями §YАрбатско-Покровской§! линии и здесь живёт меньше людей, жизнь здесь вполне сносная, хоть и нелёгкая."