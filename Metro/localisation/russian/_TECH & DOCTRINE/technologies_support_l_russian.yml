  tech_piercing_elongated_barrel: "Удлинённый ствол"
  tech_piercing_elongated_barrel_desc: "Искусственное удлинение ствола повышает его точность и потенциальную огневую мощь. Не знаю, как именно это происходит, но инженеры утверждают, что так и есть, и лучше к ним прислушаться, если только твой диплом не говорит об обратном, придурок."

  tech_piercing_sniper_handle_stock: "Снайперская рукоятка и приклад"
  tech_piercing_sniper_handle_stock_desc: "Простая деревянная ложа с кисточками, сделанными на заказ и, судя по всему, снятые с настоящей снайперской винтовки. Удобно лежит в руке. Мрачное напоминание о тех временах, когда оружие было удобным в обращении, а не натирало мозоли и не оставляло ссадин на грязных пальцах."

  tech_piercing_assault_handle_stock: "Штурмовая рукоятка и приклад"
  tech_piercing_assault_handle_stock_desc: "Несмотря на самодельную конструкцию и гораздо более примитивный дизайн по сравнению со снайперской рукояткой и прикладом, он не менее эффективен. Однако, несмотря на довольно грубый внешний вид, большая часть «мертвого груза» была убрана. Если вы сможете не обращать внимания на бессистемный, мрачный внешний вид устройства, то это так."

  tech_piercing_extended_magazine: "Расширенный магазин"
  tech_piercing_extended_magazine_desc: "Знаю только, что наши технические специалисты наконец-то пришли к выводу, что однозарядная винтовка не сможет пробиться сквозь орды противников. Возможно, самогон ударил им в голову, но, как бы то ни было, оснастить наши винтовки магазинами — это очевидное решение. Меньше времени тратится на перезарядку, больше — на прицеливание в потенциальную цель. И всё же возникает вопрос: почему мы не додумались до этого раньше?"

  tech_piercing_laser: "Лазерное устройство"
  tech_piercing_laser_desc: "Примитивная лазерная указка, которую один из техников купил у проезжего торговца и прикрепил к стволу винтовки, чтобы на мишени появлялось маленькое красное пятнышко. Преимущества очевидны, но вот где нам взять столько лазерных указок — это уже совсем другой вопрос. Как думаешь, Игорь, на поверхности есть какие-нибудь московские лазерные заводы?"

  tech_piercing_telescopic_sight: "Оптический прицел"
  tech_piercing_telescopic_sight_desc: "Позволяет вести прицельную стрельбу на гарантированном расстоянии, не утяжеляя винтовку бесполезным хламом. Однако из-за дополнительных прицелов может сужаться поле зрения стрелка."

  tech_piercing_collimator_sight: "Коллиматорный прицел"
  tech_piercing_collimator_sight_desc: "Этот довоенный прицел значительно облегчает прицеливание на близких и средних дистанциях, не слишком ограничивая поле зрения."

  tech_piercing_flame_trap: "Пламегаситель"
  tech_piercing_flame_trap_desc: "Снижает отдачу и тем самым повышает точность выстрелов. Пламегаситель подавляет ослепляющее пламя выстрела, что особенно важно в вечной темноте туннелей."
  
  tech_piercing_short_recoil_operation: "Операция с малой отдачей"
  tech_piercing_short_recoil_operation_desc: ""

  tech_sappers_1: "Сапёры I"
  tech_sappers_1_desc: "Строительство укреплений и преодоление препятствий необходимо нашим вооруженным силам в полевых условиях. Обеспечение наших армий универсальной группой поддержки, будь то строительство бункеров и оборонительных позиций или прорыв через них."
  tech_sappers_2: "Сапёры II"
  tech_sappers_2_desc: "Обеспечение наших сапёров специализированным оборудованием - кусачками для проволоки, сварочными аппаратами и тому подобным повышает общую эффективность наших сил."
  tech_sappers_3: "Сапёры III"
  tech_sappers_3_desc: "Дополнительные инструменты и оборудование облегчат работу наших сапёров. В частности, мы снабдим их бронежилетами и бронированным снаряжением."
  tech_sappers_4: "Сапёры IV"
  tech_sappers_4_desc: ""
  tech_sappers_5: "Сапёры V"
  tech_sappers_5_desc: ""

