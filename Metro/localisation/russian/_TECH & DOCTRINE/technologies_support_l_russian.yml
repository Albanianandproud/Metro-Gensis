  tech_explosive_infantry_gear: "Обучение ополченцев работе с гранатами"
  tech_explosive_infantry_gear_desc: "Снабжение гранатами наших нерегулярных формирований повысило бы их боевую эффективность. Просто выдерни чеку и молись богу, чтобы попасть в цель".
