l_russian:
  GWC_burn_technology: "§RТехнология сжигания§!"
  GWC_burn_technology_desc: "Коррумпированные неверующие по-прежнему отчаянно цепляются за свои вечные артефакты Cтарого мира, как будто это может спасти их от греховной и полной страданий жизни.\n\nВсе технологии должны быть сломаны и уничтожены! Все остатки тёмной эпохи человечества должны быть преданы забвению!"
  GWC_deploy_the_cultists_into_field: "Боевые отряды культистов"
  GWC_deploy_the_cultists_into_field_desc: "Хотя Жрец проповедует мир и отвергает любую идею войны, защита нашего дома от угроз - это совершенно другое дело. Если ситуация когда-нибудь станет настолько тяжелой, проповедники Червя могут помочь нам в битве, что поднимет моральный дух наших воинов."
  GWC_burn_technology_chemicals: "Избавиться от оскверняющих химикатов"
  GWC_burn_technology_chemicals_desc: "Старые артефакты, оставшиеся от Cтарого мира, должны быть уничтожены."
  GWC_burn_technology_electronics: "Разбить вдребезги дьявольские устройства"
  GWC_burn_technology_electronics_desc: "Детали, инструменты и прочие свидетельства отрицания Любви Великого Червя, созданные людьми-машинами, должны быть разбиты вдребезги любой ценой."
  GWC_burn_technology_guns: "Разобрать дьявольские технологии"
  GWC_burn_technology_guns_desc: "Самое гнусное из всех творений людей-машин — их машины для убийства. Наши жрицы тщательно подготовят необходимые ритуалы для разборки, чтобы эти устройства больше никогда не причинили вреда."
  GWC_infiltration_LR: "Проникнуть к язычникам"
  GWC_announce_a_day_of_worship: "Провести день священного богослужения"
  GWC_militarization: "Милитаризация"
  GWC_escalate_war_against_enemies: "Разжечь конфликт с язычниками"
  GWC_escalate_war_against_enemies_desc: "Если они хотят сражаться с монстрами и тьмой, пусть так и будет."
