l_russian:
  VDN_branching_out: "За пределами [VDN.capital.GetName]"
  VDN_branching_out_desc: "Собственные герметичные двери ВДНХ были демонтированы инженерами более десяти лет назад. До сих пор мы не видели ни одного мутанта, забредшего с севера. Уменьшилась ли угроза мутантов? Некоторые в содружестве верят в это и убеждены, что сейчас самое подходящее время для попытки расширения и переселения на соседнюю станцию [307.GetName]."

  VDN_establish_defensive_watch: "Защитный дозор"
  VDN_establish_defensive_watch_desc: "Туннель за станцией [VDN.capital.GetName] был расчищен от обломков. Полдюжины раздутых крыс не могли сравниться с нашими солдатами! Гарнизону следует поручить охрану участка туннеля, чтобы обеспечить безопасный проезд грузов снабжения и, в конечном счёте, поселенцев дальше на север."

  VDN_repair_routelines: "Баррикады боковых туннелей"
  VDN_repair_routelines_desc: "Мы не можем заделать все щели и замаскировать технические туннели. Нам остаётся только попытаться перекрыть к ним доступ и надеяться, что то, что скрывается внутри, не выйдет на свет."

  VDN_drawing_from_populace: "Проект от станции [VDN.capital.GetName]"
  VDN_drawing_from_populace_desc: "Для охраны станции требуется больше трудоспособных людей. Несомненно, наши планы по призыву населения будут встречены не просто недовольством."

  VDN_funding_expansion: "Финансирование дальнейших расширений"
  VDN_funding_expansion_desc: "Нашим часовым требуется больше оружия. Караваны с оружием - редкое явление в этой части метро, но, несомненно, как только распространится слух о нашем расширении, многие торговцы будут стремиться заключить выгодные сделки с нашей станцией. Возможно, особенно те, кто из Ганзы..."

  VDN_establish_defensive_watch_3: "Наше восхождение к станции [307.GetName]"
  VDN_establish_defensive_watch_3_desc: "Теперь, когда предварительный туннель защищён, дальнейшее расширение оправдано. Осталось ещё немного..."

  VDN_fortifications: "Наспех возведённые укрепления"
  VDN_fortifications_desc: "Эти наспех сооружённые баррикады гораздо лучше, чем стоять прямо на открытом месте."

  VDN_funding_outwards: "Увеличить оборонный бюджет"
  VDN_funding_outwards_desc: "Больше войск. Больше оружия, больше часов на огневых рубежах неизменно приводит к увеличению расходов на финансирование наших военных усилий. Поставки и так на исходе, необходимо обеспечить ещё один раунд финансирования."

  VDN_communication_lines: "Линии связи"
  VDN_communication_lines_desc: "Между нашей станцией и нашими отрядами, отправленными дальше на север, необходима молниеносная связь. Даже если она будет осуществляться по хлипким проводам, это гораздо лучше, чем отчаянно кричать в пустоту в надежде, что кто-нибудь ответит."

  VDN_explore_botanical_gardens: "На станцию [307.GetName]"
  VDN_explore_botanical_gardens_desc: "С чистым побережьем и безопасными способами пересечения туннелей, сейчас самое время начать расширяться. Ещё одна станция скоро будет добавлена ​​к нашему растущему штату."
  VDNK_botanical: "Наши войска вступят в бой с станцией §Y[307.GetName]§!, расчистят путь для поселенцев и в конце концов вернут себе её."

  VDN_the_VDNKH: "Собирая осколки"
  VDN_the_VDNKH_desc: "После того как наши планы по колонизации станции [307.GetName] провалились, поддержка нынешней администрации упала до рекордно низкого уровня. В ходе неудачной попытки мы потеряли ценные ресурсы, рабочую силу и, что ещё важнее, поддержку. Сейчас как никогда важно восстановить доверие населения."
  
  VDN_commercialized_fungiculture: "Коммерциализация грибоводства"
  VDN_commercialized_fungiculture_desc: "Ресурсы и человеко-часы были отвлечены от сельского хозяйства на поддержку наших первых попыток колонизации. Первым делом мы должны направить время и силы на то, чтобы наладить производство грибов и сделать его экспортно ориентированным."

  VDN_establish_libraries: "Создание библиотеки"
  VDN_establish_libraries_desc: "В отличие от других станций, мы не бедствуем. Книги по-прежнему представляют ценность, даже если многие по рассеянности используют пейджеры в качестве топлива. Если у нас останутся лишние патроны, мы сможем создать библиотеку, которой смогут пользоваться все желающие."

  VDN_fund_bookreading: "Обязательная грамотность"
  VDN_fund_bookreading_desc: "Когда-нибудь наши дети унаследуют этот мир — или то, что от него останется. Мы должны дать им все возможные преимущества. Ни один ребёнок не должен быть обделён."
  VDN_trade_for_research: ""

  VDN_social_support: "Социальная поддержка"
  VDN_social_support_desc: "Чтобы защитить наше население от трудностей, необходимо создать сплочённую сеть. Недостаток поддержки, несомненно, снизит качество жизни наших граждан."

  VDN_health_hygiene: "«Универсальное» здравоохранение"
  VDN_health_hygiene_desc: "Государственные инициативы, финансируемые из бюджета, будут направлены на то, чтобы полностью устранить риск заболеваний и инфекций среди нашего населения. Профилактическая помощь и медицинский контроль позволят нам сохранить здоровье и работоспособность наших граждан."

  VDN_research_6: "Знание — сила"
  VDN_research_6_desc: "Материальные блага — это ещё не всё, но навыки и знания обладают гораздо большей и более устойчивой ценностью."

  VDN_research_6a: "Помощь в экспорте знаний"
  VDN_research_6a_desc: "Зачем останавливаться на грибах? Наши знания сами по себе тоже ценный товар. Мы можем оказывать помощь по всему Метро тем, кто в ней нуждается."

  VDN_mushroom_tea_industry: "Производство грибного чая"
  VDN_mushroom_tea_industry_desc: "Экспорт чая, доставляемого на Кольцо и предназначенного для отправки дальше, принесёт нам немалый доход, который мы сможем использовать для улучшения нашей станции."

  VDN_piggies: "Создание свиноферм"
  VDN_piggies_desc: "Мы также можем создать несколько свиноферм, если найдём подходящих свиноматок. Экспорт мяса и шкур также принесёт нам чистую прибыль."

  VDN_exports: "Экспортная экономика"
  VDN_exports_desc: "Выживание станции ВДНХ во многом зависит от экспорта продукции. Торговля — это кровеносная система станции и, возможно, всего северо-восточного участка линии. Без него ВДНХ, несомненно, пала бы много лет назад, и тогда мутанты из Ботанического сада заполонили бы все Метро."
  VDN_export_idea_tt: "Пока у нас действует либо §YЗакон о свободной торговле§!, либо §YЗакон об экспортной ориентации§! торговли, мы получаем:"

  VDN_exports_2: "Титан межстанционной торговли"
  VDN_exports_2_desc: "В отличие от процветающих станций Ганзы, Арбата и Полиса, станция ВДНХ может спокойно существовать, пока торговые караваны беспрепятственно проходят через неё. Кто-то даже может сказать, что со временем и при должном усердии ВДНХ вполне может стать крупным игроком в Метро."

  VDN_medical_wards: "Сортировочные палаты"
  VDN_medical_wards_desc: "Улучшение жизни наших граждан — наш моральный долг! Мы должны приложить все усилия, чтобы обеспечить каждому человеку максимально возможное качество жизни, которое мы можем себе позволить."

  VDN_economy_2: "Грибная экономика"
  VDN_economy_2_desc: "Вдали от таких житниц, как Замоскворецкий торговый союз, ВДНХ в основном полагается на экспорт продовольствия в Ганзу, чтобы получать прибыль и обеспечивать себе средства к существованию."

  VDN_economy_2a: "Из праха цивилизации"
  VDN_economy_2a_desc: "Мы можем разграбить прах Земли. Непосредственное формирование наших команд сборщиков и расстановка приоритетов в отношении ресурсов, которых нам катастрофически не хватает, позволят нам не остаться без самого необходимого в трудную минуту."

  VDN_economy_3: "Необходимость собирательства"
  VDN_economy_3_desc: "В приоритете — добыча материалов из любых свалок и заброшенных туннелей. Мы не можем позволить себе рыться в каждой ржавой балке или куче щебня."

  VDN_economy_3a: "Восстановленные динамо-машины"
  VDN_economy_3a_desc: "Энергия — это роскошь, которую может позволить себе не каждый, а лишь немногие. Там, где целые заводы могли бы вырабатывать достаточно энергии, чтобы обеспечить электричеством миллионы людей, только самодельные динамо-машины и хрипящие генераторы не дают нашей станции погрузиться в полную темноту."

  VDN_economy_4: "Скромное процветание"
  VDN_economy_4_desc: "Возможно, мы не так богаты, как Ганза, не так изнежены, как политбюро Красной линии, и даже не так защищены от ужасов этого умирающего мира, как Полис, но для наших граждан, живущих обычной жизнью, эта «обычность» — гораздо больше того, о чем могут мечтать жители многих других станций."

  VDN_economy_5: "Торговля по необходимости"
  VDN_economy_5_desc: "Выживание — это отдельная валюта. Её можно купить и продать. Каждый ящик с грибами, сумка с инструментами или патрон переходят из одних рук в другие. Чтобы обеспечить будущее станции [ROOT.Capital.GetName], это никогда не должно прекращаться."

  VDN_economy_6: "Торговая сеть"
  VDN_economy_6_desc: "О процветании торговли можно судить не по богатству, а по её решительности. Каждый защищённый караван, каждая честная сделка только укрепляют наши позиции в качестве важнейшей артерии Метро."

  VDN_economy_7: "Преданные своему делу техники"
  VDN_economy_7_desc: "Чтобы позволить нашим инженерам не только ремонтировать и восстанавливать инструменты, но и разрабатывать и создавать совершенно новое оборудование, нужны усилия."

  VDN_economy_commonwealth: "Наша предначертанная судьба"
  VDN_economy_commonwealth_desc: "За десятилетия, прошедшие с момента полного краха, общество в чем-то откатилось назад, но в то же время сделало шаг вперед. Культура по-прежнему процветает в Метро, и хотя всё больше людей забывают, как работал и функционировал Старый мир, на его месте начинает формироваться новый."

  VDN_economy_8: "Поощряйте наставничество"
  VDN_economy_8_desc: "Каждый сломанный инструмент — это еще один осколок старого мира, безвозвратно утраченный. Однако величайшими сокровищами мира являются не материальные ценности, а знания, необходимые для поддержания их работоспособности. Формализация этих практик и обеспечение преемственности знаний позволят сохранить их."

  VDN_economy_9: "Расширение экономических зон"
  VDN_economy_9_desc: "Поддержание сети сборщиков и разведывательных экспедиций поможет нам координировать усилия по всей границе, и с каждым успехом мы будем получать все больше ресурсов."

  VDN_burgeoning_station2: "Процветание в изобилии"
  VDN_burgeoning_station2_desc: "Не только станция ВДНХ должна жить в относительном достатке, но и все остальные станции Содружества должны иметь такой же уровень жизни."

  VDN_burgeoning_station0: "Укрепленная защита от ночи"
  VDN_burgeoning_station0_desc: "Точно так же все станции должны соответствовать стандартам, установленным на ВДНХ. Каждая станция должна быть самостоятельной крепостью."

  VDN_burgeoning_station1: "Локальные склады для сбора"
  VDN_burgeoning_station1_desc: "Склады для сбора припасов дадут местным сталкерам возможность правильно хранить и утилизировать остатки Старого мира, пока они не исчезли навсегда."

  VDN_political_1: "Политические манёвры"
  VDN_political_1_desc: "Сохранение станции ВДНХ необходимо не только для наших граждан, которые здесь живут, но и для всего Метро в целом. Наша судьба в наших руках, мы должны объединиться, иначе нас сметёт."

  VDN_exhibition_station: "Жилищное строительство"
  VDN_exhibition_station_desc: "Первое, что нужно сделать для того, чтобы должным образом удовлетворить потребности наших граждан, — это обеспечить их жильём. Наша первоочередная задача — сделать так, чтобы у каждого гражданина была крыша над головой и возможность вернуться домой после рабочего дня, проведённого у тёплого очага."

  VDN_planning_zones: "Планировочные зоны"
  VDN_planning_zones_desc: "Пространство ограничено, и его нужно использовать рационально и с умом. Правильное определение зон и участков для будущих строительных работ — хороший выбор."

  VDN_citizens_to_work: "Задействовать граждан"
  VDN_citizens_to_work_desc: "Безделье — это роскошь, которую мы не можем себе позволить. Каждый гражданин, будь то молодой или старый, мужчина или женщина, должен сам себя обеспечивать."

  VDN_salvage: "Усилия по сбору мусора"
  VDN_salvage_desc: "Ржавые балки, разбитые шлакоблоки и арматура все ещё могут пригодиться, даже если на первый взгляд это не так очевидно. Мы должны сохранить эти ресурсы для дальнейшего использования, для каких бы целей они ни понадобились."

  VDN_procure_tools: "Усилия по заготовке инструментов"
  VDN_procure_tools_desc: "Одна затупившаяся пила на несколько десятков плотников — верный путь к застою. По крайней мере, если мы не можем раздобыть новые инструменты, у нас должно быть несколько одинаковых."

  VDN_wooden_shacks: "Деревянные лачуги"
  VDN_wooden_shacks_desc: "До сих пор мы не могли позволить себе более прочные конструкции. Они должны выдерживать больше, чем простая палатка."

  VDN_shared_tooling: "Общие рабочие места"
  VDN_shared_tooling_desc: "Общественные верстаки позволят нашим гражданам иметь место для работы, не неся при этом непомерных расходов. Централизованное место для работы, хранения инструментов и ресурсов повысит общую производительность и эффективность труда наших работников."

  VDN_burgeoning_station: "Растущая станция"
  VDN_burgeoning_station_desc: "То, что несколько лет назад представляло собой не более чем полдюжины ветхих палаток, превратилось в процветающее поселение, наполненное шумом и суетой цивилизации во всей её ветхой, но скромной красе."

  VDN_shared_tooling_2: "Расширение производства"
  VDN_shared_tooling_2_desc: "Специализированные верстаки, станки и другие усовершенствованные приспособления, несомненно, позволят нашим техникам и ремесленникам совершенствовать и оттачивать своё мастерство."

  
  VDN_soviet_ideals_path: "Окунитесь в советскую ностальгию"
  VDN_soviet_ideals_path_desc: "Коллективистская солидарность, равенство и сильное государство должны быть нашими главными приоритетами. С приукрашиванием прошлого или без него, но коллективный дух и обеспечение базовых потребностей наших граждан должны быть реализованы."

  VDN_collective_path: "Коллективное единство"
  VDN_collective_path_desc: "Безопасность коллектива и федеральная централизованная система, направленная на обеспечение выживания и самозащиты, — это необходимость. Мы можем рассчитывать только на себя и на поддержку наших соседей."

  VDN_centralize_station_authority: "Расширить полномочия Совета станции"
  VDN_centralize_station_authority_desc: ""

  VDN_political_7: "Выстраивание единой линии"
  VDN_political_7_desc: "Мы должны стать единым целым от начала до конца, иначе рискуем исчезнуть. Один за всех. Все за одного."

  VDN_political_6: "Общее дело"
  VDN_political_6_desc: ""

  VDN_political_9: "Укрепление межстанционных связей"
  VDN_political_9_desc: ""

  VDN_political_8: "Развивать добрую волю"
  VDN_political_8_desc: ""

  VDN_political_9A: "Развивать межстанционные торговые отношения"
  VDN_political_9A_desc: ""

  VDN_political_10: "Вооружить караваны"
  VDN_political_10_desc: ""

  VDN_political_11: "Якорь сотрудничества"
  VDN_political_11_desc: ""

  VDN_capitalism_path: "Государственный капитализм"
  VDN_capitalism_path_desc: "Прямая собственность, сильное влияние и поддержка нашей местной экспортной экономики позволят нам накапливать богатство и конкурировать в качестве крупного игрока на рынке Метро. Благодаря практическому подходу мы сможем использовать накопленные средства для улучшения жизни наших граждан. Не только в денежном выражении, но и за счет внедрения инноваций и привлечения талантливых специалистов."

  VDN_political_12: "Защищать гражданские свободы"
  VDN_political_12_desc: ""

  VDN_political_13: "Поощрять частное предпринимательство"
  VDN_political_13_desc: ""

  VDN_export_economy: "Заключать выгодные торговые соглашения"
  VDN_export_economy_desc: ""

  VDN_political_15: "Монополизировать торговлю грибами"
  VDN_political_15_desc: "Другие станции могут только мечтать о том, чтобы конкурировать с нашей растущей экспортной экономикой. С торговлей приходит богатство, а с богатством мы можем обменять его на власть."
  VDN_political_15_tt: "Решения, связанные с торговлей, теперь дают вдвое больше патронов."
  VDN_political_15_a_tt: "Открывает доступ к решениям, позволяющим привлечь станцию §Y[PRO.GetFlag][PRO.GetName]§! в сферу нашего влияния и, возможно, подчинить их своей воле, если мы ещё не создали Содружество ВДНХ!"

  VDN_political_16: "Совместная собственность"
  VDN_political_16_desc: "Необходимо добиться прогресса в восстановлении прав нашего населения на доступ к объектам инфраструктуры». Верстаки, инструменты — наши граждане будут владеть средствами для своего труда."

  VDN_political_17: "Процветание для всех"
  VDN_political_17_desc: ""

  VDN_political_18: "Повышение уровня жизни"
  VDN_political_18_desc: ""
  
  VDN_political_19: "Возвращение столовых"
  VDN_political_19_desc: "Очереди за хлебом — неотъемлемая часть советской истории России. Вместо того чтобы напоминать об экономическом бремени и нехватке продовольствия, на этот раз мы продемонстрируем нашим гражданам изобилие продуктов. По крайней мере, один приём пищи в день."

