  VDN_military_economy_5_desc: ""

  VDN_military_economy_6: "Deploy Soldiers to the 300th Meter"
  VDN_military_economy_6_desc: ""

  VDN_military_economy_7: "Push Patrols to the 450th Meter"
  VDN_military_economy_7_desc: ""

  VDN_military_economy_8: "Extend to the 480th Meter"
  VDN_military_economy_8_desc: "More fervent mutant incursions require us to be even more proactive in eliminating them. Every tunnel must be scoured and purged of filth. Only the most capable and trained of our soldiers will be able to take this task, and venture further into the darkness."

  VDN_military_economy_9: "Stationary Emplacements"
  VDN_military_economy_9_desc: "Station tracks can be broken up into makeshift hedgehog emplacements, gravel bagged up to make fortified firesteps. In time we will make VDNKh a impregnable bastion."

  VDN_military_economy_10: "The Armories of VDNKh Station"
  VDN_military_economy_10_desc: "Though nothing compared to the likes of Kuznetsky Bridge, our modest armory can equip our armed forces. And that is enough for us."

