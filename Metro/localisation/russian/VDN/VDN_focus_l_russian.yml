  VDN_commonwealth_formed_focus_4_economic_2: "Преодоление временной слепоты"
  VDN_commonwealth_formed_focus_4_economic_2_desc: "Вы не поверите! Граждане станции [317.GetName] даже не умеют определять время! Их вокзальные часы украли много лет назад, и с тех пор на вокзале нет ощущения времени. Первым делом нужно хотя бы установить часы на станции."

  VDN_commonwealth_formed_focus_4_economic_3: "Поддержка местной экономики станции [424.GetName]"
  VDN_commonwealth_formed_focus_4_economic_3_desc: "Многие жители станции [424.GetName] занимаются торговлей и ведут прибыльную торговлю с соседним Проспектом Мира. Есть и другие виды деятельности, например торговля свиным навозом и вязанием. Оба этих вида деятельности являются ключевыми для экономики станции."

  VDN_commonwealth_formed_focus_4_economic_4: "Помощь гарнизону станции [424.GetName]"
  VDN_commonwealth_formed_focus_4_economic_4_desc: "Несмотря на то, что [424.GetName] на первый взгляд выглядит более внушительно, чем их соседи, у них есть собственные отряды, которые охраняют туннели. Хотя их вооруженные силы сосредоточены в основном на южном направлении, учитывая наличие множества туннелей, ведущих на Проспект Мира, это сильно истощает ресурсы станции."
  VDN_commonwealth_formed_focus_4_economic_4_tooltip: "Цена присоединения станции §Y[RIZ.GetFlag][RIZ.GetName]§! благодаря решению £pol_power_icon §G-100§!"

  VDN_commonwealth_formed_focus_4_economic_5: "Ворота в Кольцо"
  VDN_commonwealth_formed_focus_4_economic_5_desc: "Несмотря на то, что избавиться от мрачного настроения, царящего на станции, невозможно, благодаря нашей помощи их положение значительно улучшилось. Туннели укомплектованы персоналом, экономика стабилизирована. Хотя ворчание и жалобы вряд ли прекратятся в ближайшее время, многие не могут не признать, что дела налаживаются."

  VDN_commonwealth_formed_focus_4_economic_6: "Навести порядок в гарнизоне станции [317.GetName]"
  VDN_commonwealth_formed_focus_4_economic_6_desc: "Вооружённые силы станции [317.GetName] не блещут профессионализмом, мягко говоря. Моральный дух и дисциплина среди рядового состава крайне низкие. Учитывая бедственное положение станции, вооружённые силы могут позволить себе только стёганые куртки и самое необходимое для боевых вылетов."
  VDN_commonwealth_formed_focus_4_economic_6_tooltip: "Цена присоединения станции §Y[RIZ.GetFlag][RIZ.GetName]§! благодаря решению £pol_power_icon §G-100§!"

  VDN_commonwealth_formed_focus_4_economic_7: "Поддержка грибной промышленности станции [317.GetName]"
  VDN_commonwealth_formed_focus_4_economic_7_desc: "Следуя нашей экономической модели, соседи из [317.GetAdj] быстро попытались перенять наш опыт и подражать нам. Однако их попытки с треском провалились: при загадочных обстоятельствах у них погибли все посевы и свиньи. Станция едва могла прокормить себя, и торговля пришла в упадок."

  VDN_commonwealth_formed_focus_4_economic_8: "Принести процветание [317.GetName]"
  VDN_commonwealth_formed_focus_4_economic_8_desc: "Кто-то мог бы сказать, что [317.GetName] — всего лишь жалкая имитация Выставочной станции, но это уже не так. С нашей помощью они начали процветать и превратились в цветущую станцию. Наши опытные фермеры помогают своим товарищам и поддерживают грибную и сельскохозяйственную отрасли."

  VDN_commonwealth_formed_focus_4_economic_9: "Снизить напряжённость на станции [424.GetName]"
  VDN_commonwealth_formed_focus_4_economic_9_desc: "Атмосфера на станции[424.GetName] всегда была напряжённой. Люди здесь живут в постоянном напряжении. Будь то давление со стороны станций на юге или невидимые угрозы. На станции всегда царило мрачное настроение. Но теперь, когда мы обеспечиваем ей полную защиту, всё изменилось."

  VDN_commonwealth_formed_focus_4_economic_10: «Восходящая звезда над метрополией»
  VDN_commonwealth_formed_focus_4_economic_10_desc: "Из маленькой захолустной станции на задворках цивилизации станция ВДНХ превратилась в процветающее общество. Можно сказать, что она стала маяком света в бушующем шторме."
  VDN_commonwealth_formed_focus_4_economic_10_tooltip: "Разблокируйте возможность аннексии станций §Y[ALK.GetFlag][ALK.GetName]§! и §Y[RIZ.GetFlag][RIZ.GetName]§! через решения"
  
