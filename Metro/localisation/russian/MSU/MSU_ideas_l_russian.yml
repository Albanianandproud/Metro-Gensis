l_russian:
  MSU_mythical_city: "Изумрудный Город"
  MSU_mythical_city_desc: "По всем притонам метро ходят слухи о призрачном сообществе на станции, расположенном по ту сторону глубоких вод Москвы-реки. Это сообщество, состоящее в основном из учёных и студентов Московского университета, было защищено от ядерного армагеддона, укрывшись в своих станциях-крепостях Университет, Проспект Вернадского и Юго-Западная. Известная текущая протяжённость или даже само её существование окутано тайной - они существуют только в баснях, рассказанных в виде небылиц, рассказов друзей друга или просто сплетен странствующих торговцев. По мере того, как правда и миф стираются и всё больше превращаются в легенды, остаётся одно. ЧТО-ТО... или КТО-то живёт напротив станции метро Воробьёвы горы."


  MSU_isolation_tt: "£trigger_no Заселить заброшенные территории."

  MSU_science_directorate: "Учёный народ"
  MSU_science_directorate_desc: ""
  MSU_free_scavenging_tt: "\n§YРешения по сбору припасов принимаются бесплатно§!"

  MSU_isolationism: "Изоляционист"
  MSU_isolationism_desc: "Расположенный на другом берегу Москвы-реки, [MSU.GetName] стал неприступным бастионом против любых потенциальных угроз со стороны остальной части Метро. Будь то человек, зверь или что-то еще. Раскрытие себя в данный момент времени в конечном счёте поставило бы под угрозу их безопасность."
 
