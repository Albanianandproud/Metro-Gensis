 VDN_alexander_sukhoi_trait: "Министр связи"
 VDN_alexander_sukhoi_desc: "§9«Неухоженные усы, уже поредевшие и совсем седые волосы, перекинутые, как мостик, через плешь. Но лицо было вычерчено исключительно прямыми линиями, без округлостей. И все остальное в нём было жёстким и упругим — слишком жёстким, чтобы его можно было разжевать, как будто этого человека взяли и вулканизировали заживо».§!\n\nСухой, отвечающий за внешнюю политику станции ВДНХ, не понаслышке знает, что такое длительные и опасные командировки за границу и даже за пределы «кольца»."

