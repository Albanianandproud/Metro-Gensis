  tech_sentinels_1: "Sentinels I"
  tech_sentinels_1_desc: "We must adequately respond to not simply mutants, but sabotage and dissent from our enemies. A integral force for combating and acting as an overwatch is necessary."
  tech_sentinels_2: "Sentinels II"
  tech_sentinels_2_desc: "Policing, and patrol duties in order to maintain public order and mutant excursions can minimize any partisans or saboteurs if they ever arise."
  tech_sentinels_3: "Sentinels III"
  tech_sentinels_3_desc: "Cooperating with local sympathizers and stamping out rogue elements in our occupied territories will increase the overall compliance of our subjects."
  tech_sentinels_4: "Sentinels IV"
  tech_sentinels_4_desc: "Allowing further autonomy to our Sentinels when managing entire stations, will allow for further flexibility in to exert their control. Whether that be increased curfews, securing access to parts of their presiding station, or simple interrogation and pest control."
  tech_sentinels_5: "Sentinels V"
  tech_sentinels_5_desc: "Ruthlessly eliminating opposition must come with a degree of strategy, with the main goal to integrate stations into our political authority. Whether civilians want to or not."

