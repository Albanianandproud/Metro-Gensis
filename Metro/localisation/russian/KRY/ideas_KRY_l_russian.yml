 KRY_something_wicked_this_way_comes:0 "Что-то недоброе приближается..."
 KRY_something_wicked_this_way_comes_desc:0 "§YКрылатское§!, отделённое от остальной части метро бесчисленными туннелями, изолировано от других станций. Соседние станции на севере отрезаны, и §YКрылатское§! остаётся настороже из-за слухов о чудовищных полулюдях-полумутантах, которые бродят по южным туннелям и неглубокой станции §YМолодежная§!. Достаточно сказать, что станция готовится к худшему."