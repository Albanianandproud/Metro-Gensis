  ULI_evacuate_north_category_desc: "\n\n\n\n\n\n\nВ связи с ростом паранормальной активности и участившимися исчезновениями мы предполагаем, что две станции §Y[302.GetName]§! и §Y[267.GetName]§! в конечном итоге станут §Rнепригодными для жизни§!!\n\nМы можем принудительно эвакуировать гражданское население, не поднимая шума, или попытаться противостоять угрозе.\n"
  ULI_dark_ones_crisis: "Произошло стихийное бедствие на станции §Y[302.GetName]§!"
