  ULI_evacuate_north_countdown_risk_desc: "Мы не сможем долго удерживать наши северные позиции, учитывая нынешние проблемы в столице [ULI.capital.GetName]. Возможно, вместо того чтобы пытаться одолеть их с помощью оружия и железа, разумнее будет вообще уйти с севера."
