  VDN_military_economy_4: "Mandatory Service"
  VDN_military_economy_4_desc: "From teenagers to old men, those who are able to pick up a gun and shoot are expected to serve in the garrison in some way shape or form. We require all the hands we can potentially get, even if that means drawing from our Male population."

