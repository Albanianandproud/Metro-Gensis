l_english:

  nf_VDNK.1.t: "Station Merger"
  nf_VDNK.1.d: "The idea of forging a union had always existed in the minds of us, but only until now have plans been fully put in motion. From increasing pressure both from the south and north, the management of [ALK.GetName] and [Riz.GetName] have turned to us with proposals to merge. Details and discussions on the merger are still being ironed out, as a congress of representatives to approve the union will commence in the near future. Though skepticism to the benefits of this merger still pervails in some spheres, the union will undoubtedly strengthen economic cooperative between us, as well as providing extra defensive measures; both against any threats of expansion from the south, or emergent horrors from the the north."
  nf_VDNK.1.a: "For a united, prosperous and peaceful line."

  nf_VDNK.2.t: "A Place to Call Home"
  nf_VDNK.2.d: "An increasing number of travellers have arrived at our checkpoints, requesting permission to settle and become citizens in our station.\n\nThe group are an assortment of people. From cripples, to fit and able-bodied. Men, Women and Children of all ages. All seeking somewhere safe to work. Many may possess useful skills or expertise, and may become valuable members of our station in time."
  nf_VDNK.2.a: "They may emigrate, provided they work to earn their keep."
  nf_VDNK.2.b: "Turn them away. We cannot sustain a larger population"

  nf_VDNK.3.t: "A beacon in the Dark"
  nf_VDNK.3.d: "With our caravans departing to neighboring stations, carts ladened with provisions and books, comes a seldom ounce of comfort which ensures life may be worth living. Those who need will make generous use of the aid we provide them. For a world so seeped in the mindest of taking whatever they can, perhaps it is still worth remembering that some can still choose to give."
  nf_VDNK.3.a: "Once more, we lead the way, beacon in hand."
  nf_VDNK.3.b: "There is no price on Generosity."

  nf_VDNK.4.t: "Communication Wire Installed"
  nf_VDNK.4.d: "With our technicians successfully establishing direct communications between us and Rizhskaya and Alekseyevskaya, we may now coordinate transaction and commerce between us. No more do negotiation envoys need to be dispatched. Some within our sphere claim that with this connection established, little by little has Vdnkhs isolation been broken. The practical benefits would be foolish to dismiss.. And not to hard to reap the benefits of."
  nf_VDNK.4.a: "One step closer to a unified line."
  nf_VDNK.4.b: "This is a net positive for everyone."

  nf_VDNK.5.t: "Exploration of Botanical Gardens"       ## Fake Event. Never meant to trigger!
  nf_VDNK.5.d: "NOPE"
  nf_VDNK.5.a: "NOPE"

  nf_VDNK.6.t: "Disaster!"
  nf_VDNK.6.d: "Disaster has struck VDNKh. We dug too shallow and too greedily. For a while, it seemed Botanical was rid of mutants, but our arrogance was our undoing. Our settlers have been recklessly slain by mutants in. Our armed forces were overwhelmed. We stepped too far, and now suffer the consequences for our hubris."
  nf_VDNK.6.a: "This is terrible."
  nf_VDNKh.6_tt: "\nMutants from §Y[307.GetName]§! will periodically attack §Y[ROOT.Capital.GetName]§! until we are able to drive the mutants out.\n\n"

  nf_VDNK.7.t: "Hanza backs our Expansion"
  nf_VDNK.7.d: "Word of our expansion efforts have falling into the ears of the Hanza. Rather than sitting idly they seem to have taken a vested interest, and seek to fund our expansion. Obviously ulterior motives are at play, but those motives remain to be seen."
  nf_VDNK.7.a: "This will come in handy"

  nf_VDNK.8.t: "Hanza Relinquishes Funding"
  nf_VDNK.8.d: "After catastrophe struck our settlers, news quickly spread and soon caught the attention of our Hanseatic backers who have withdrawn their support. "
  nf_VDNK.8.a: "To be Hanza's friend is always fatal."

  nf_VDNK.10.t: "Election"
  nf_VDNK.10.d: "In a sudden decision, [Root.GetLeader] has chosen to relinquish premiership as leader of [VDN.GetName]. While his role was that of station master, Kalyapin firmly believes that in order for management to continue to prosper in a growing age of uncertainty, someone else must take the mantleship of leader.\n\nThere is still concerns regarding our recent merger with our neighbors however, particularly those of our fighters who share such grievances, believing the union to be a 'one-way' deal of sorts, with VDNKh being forced to take an unequal share of responsibilities and having to support [RIZ.GetName] and [ALK.GetName], with skepticism regarding whether the alliance is seen as mutual.\n\nRegardless of this fact, the candidacy of head of he commonwealth is open."
  nf_VDNK.10.a: "Alexander Sukhoi was sworn in as head."
  nf_VDNK.10.b: "Desperate times require desperate measures.."

  nf_VDN_PRO.1.t: "[VDN.GetName] attempting to subvert [PRO.GetName]"
  nf_VDN_PRO.1.d: "Recent news has come to us that [VDN.GetName] are attempting to subtly manipulate [PRO.GetName] to fall beneath their sphere of orbit. This comes after the recent influx of VDNKh merchants seen in Proletarskaya, seeking to flood their market with VDNKh produce, using this as a method to bring the station into their sphere of influence.\n\nWhile VDNKh officals surely will deny and refute such preposterous claims, undoubtedly this is the case."
  nf_VDN_PRO.1.a: "[PRO.GetName] belongs underneath our rightful jurisdiction!"

  nf_VDN_neighbors.1.t: "Disaster striles [ALK.GetName]"
  nf_VDN_neighbors.1.d: "Reports have come to us regarding our neighbors of [ALK.GetName] and their attempts at remodeling their economy after our recent success. A mysterious disease has stricken their newly-purchased sows, their birthrates plummeting and their offspring being sickly and mutated. What's worse, is their mushroom crops similarly are suffering from disease. Desperate, the station authorities have reached out to us, hoping our cordial relations will result in charity."
  nf_VDN_neighbors.1.a: "Unfortunately, you're on your own"
  nf_VDN_neighbors.1.b: "Anything for a friend in need"

  nf_VDN_neighbors.2.t: "Struggling Garrison at [ALK.GetName] Station"
  nf_VDN_neighbors.2.d: "It has always been known to us that our neighbors of [ALK.GetName] have always struggled maintaining a strong armed force. With only a dozen or so guards kitted in ragged-bits of attire and scrap guns to patrol the tunnels to and from their station, their soldiers are overworked. However, it seems that they've finally ran dry on armaments, and are in desperate need of guns."
  nf_VDN_neighbors.2.a: "Unfortunately, we cannot help"
  nf_VDN_neighbors.2.b: "We may spare a few odds and ends"

  nf_VDN_neighbors.3.t: "[RIZ.GetName] Seized by terror"
  nf_VDN_neighbors.3.d: "The station of [RIZ.GetName] has always secured a sense of security positioned right on the ring line, and right besides the Hanseatic League, however it seems that not even this false sense of security can calm the growing atmosphere clouding their station. Within recent weeks, reports of growing mutant activity has stressed their station populace. Reliant on trade, an increase of mutants prowling through the tunnels will undoubtedly disrupt local trade, and stop their chief exports to the Hansa. Whats worse, is that their rather-decent militia is being worked overtime, between doubled-shifts to watch for mutants, and to ease the fears of the station populace. They've reached out to us, pleading for our assistance with reinbursing their already-fatigued garrison."
  nf_VDN_neighbors.3.a: "Sorry, but we cannot spare the extra hands"
  nf_VDN_neighbors.3.b: "We can assist"

  RIZ_tension_idea: "Rising Tension"
  RIZ_tension_idea_desc: "Recent mutant activity has sprouted anxiety amongst this station populace."
  ALK_struggling_garrison: "Struggling Garrison"
  ALK_struggling_garrison_desc: "The meagre armed-forces of this station is currently struggling to effectively guard their station."
  ALK_mushroom_economy_collapse: "Collapsed Economy"
  ALK_mushroom_economy_collapse_desc: "Recent attempts at remodeling their economy has lead to disaster, leaving the station impoverished until they can recover."
  
  nf_VDNK_darkones.1.t: " "
  nf_VDNK_darkones.1.d: " "
  nf_VDNK_darkones.1.a: " "

  nf_VDNK_darkones.2.t: "Hunter Leaves [SPT.Capital.GetName]"
  nf_VDNK_darkones.2.d: "Upon recieving word of a threat emerging from the north of the Kaluzhsko-Rizhskaya line, terrorizing the far-flung station of [336.GetName], Hunter has left by his lomesone in order to see to eliminating this new mutant problem."
  nf_VDNK_darkones.2.a: "Hunter will do what he wants. He is a devoted, but cruel maverick."
  nf_VDNK_darkones.2.a.tt: "§YHunter§! will depart to investigate the 'Dark Ones' attacking §Y[336.GetName]§!, retiring him as an §YAdvisor§! and §Ymilitary commander§!."

  nf_VDNK_darkones.3.t: ""
