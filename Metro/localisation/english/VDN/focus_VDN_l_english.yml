  VDN_military_hard_line_2_A: "Hand-Cranked Flashlights"
  VDN_military_hard_line_2_A_desc: "Far more reliable than conventional battery-powered flashlights, even if our supply of batteries have already been dried up, we can equip our soldiers with such equipment to make navigating the dark vastly easier."

